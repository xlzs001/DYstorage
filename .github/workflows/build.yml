name: Build DYStorage

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build packages
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate search catalog
        run: python3 scripts/validate_catalog.py

      - name: Check Theos cache
        run: |
          echo "upstream_heads=$(git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1)-$(git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1)" >> "$GITHUB_ENV"

      - name: Use Theos cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Remove unused Homebrew taps
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
          HOMEBREW_NO_AUTOREMOVE: "1"
        run: |
          if brew list --formula | grep -Fxq "bicep"; then
            brew uninstall --formula --ignore-dependencies bicep
          fi
          for tap in aws/tap azure/bicep; do
            if brew tap | grep -Fxq "$tap"; then
              brew untap "$tap"
            fi
          done

      - name: Prepare Theos
        uses: huami1314/theos-action@c5ddc7728cc1bcac2f07ab65fbc3022d25ce0c10

      - name: Setup GNU Make
        run: echo "$(brew --prefix)/opt/make/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Resolve package version
        id: version
        run: |
          base_version="$(awk -F': ' '$1 == "Version" { print $2; exit }' control)"
          if [ -z "$base_version" ]; then
            echo "control has no Version field" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            build_version="${GITHUB_REF_NAME#v}"
          else
            build_version="${base_version%.*}.${GITHUB_RUN_NUMBER}"
          fi
          perl -0pi -e "s/^Version:.*/Version: ${build_version}/m" control
          grep -Fxq "Version: ${build_version}" control
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "Building DYStorage ${build_version}"

      - name: Build packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -rf packages
          mkdir -p packages
          test -d "$GITHUB_WORKSPACE/theos"
          for scheme in rootful rootless roothide; do
            rm -rf .theos
            make package SCHEME="$scheme" FINALPACKAGE=1 -j"$(sysctl -n hw.ncpu)"
            for deb in packages/*.deb; do
              case "$deb" in
                *-rootful.deb|*-rootless.deb|*-roothide.deb) continue ;;
              esac
              mv "$deb" "${deb%.deb}-${scheme}.deb"
            done
          done
          ls -l packages

      - name: Verify packages
        env:
          VERIFY_SCHEMES: rootful rootless roothide
        run: python3 .github/scripts/verify_packages.py

      - name: Extract arm64 dylib
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.build_version }}
        run: bash .github/scripts/extract-release-dylib.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DYStorage-${{ steps.version.outputs.build_version }}-${{ github.run_number }}
          path: |
            ${{ github.workspace }}/packages/*.deb
            ${{ github.workspace }}/packages/*.dylib
          retention-days: 30
          if-no-files-found: error

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${{ steps.version.outputs.build_version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.deb packages/*.dylib --clobber
          else
            gh release create "$tag" packages/*.deb packages/*.dylib \
              --title "DYStorage ${version}" \
              --notes-file RELEASE_NOTES.md
          fi
